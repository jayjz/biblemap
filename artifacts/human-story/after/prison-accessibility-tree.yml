    - region "A child in the prison.":
      - paragraph: Account attributed to Perpetua
      - heading "A child in the prison." [level=2]
      - paragraph: "The prison is crowded and hot. In the account attributed to her, Perpetua fears its darkness. Her account keeps returning to someone else: her nursing child."
      - paragraph: The deacons obtain a respite. She nurses the hungry child. Later, he is allowed to stay with her. A place of confinement becomes, in her telling, a palace.
      - figure "Perpetua & her child Original relationship drawing. Not historical architecture.":
        - 'img "The child: a relationship in the account Two nested forms stand for Perpetua and her child, with a continuous line for the contact narrated in section 3. Original modern abstraction, not a portrait or a plan of the prison."'
        - text: Perpetua & her child Original relationship drawing. Not historical architecture.
      - paragraph: Follow a relationship
      - group "Follow a relationship":
        - button "Her child" [pressed]
        - button "Her family"
        - button "The deacons"
      - heading "A nursing infant" [level=3]
      - paragraph: Her care for him gives the prison account its immediate bodily stakes. His hunger and presence are described by her; his own experience does not reach us in a separate voice.
      - paragraph: Passion §3; attribution introduced in §2
