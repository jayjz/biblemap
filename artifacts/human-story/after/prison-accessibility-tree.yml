      - paragraph: The biblical narrative retains its own voice. This return does not assert a direct dependence of the Passion on Jonah.
    - region "The work that carries these voices.":
      - heading "The work that carries these voices." [level=2]
      - paragraph: The Passion’s frame attributes §§3–10 to Perpetua and §§11–13 to Saturus. A narrator introduces the prisoners and tells the ending. These are parts of one transmitted work, not a collection of independently recovered testimonies.
