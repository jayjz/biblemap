name: Jonah verification

on:
  pull_request:
  push:
    branches: [main, feat/jonah-visual-assets]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  technical:
    name: Technical checks and desktop/mobile browsers
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - run: npm run validate:story
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Verify ordinary export excludes experimental Nineveh media
        run: |
          npm run build
          node scripts/validate-nineveh-depth.mjs --production-export
      - name: Build opt-in Nineveh experience for browser tests
        run: npm run build
        env:
          BIBLEMAP_NINEVEH_REVIEW: "1"
      - run: npx playwright install --with-deps chromium
      - name: Prepare CI-only visual fixture for the gated Nineveh review
        run: |
          # The original generated landscape remains local and excluded from GitHub.
          # Only browser interaction is tested here, not artwork accuracy or aesthetic approval.
          cp artifacts/nineveh-depth/media/flood-tablet.webp artifacts/nineveh-review/landscape.webp
      - name: Browser tests for normal exported reader and atlas
        run: npm run test:e2e
      - name: Browser tests with the local-only Nineveh review server
        run: npm run test:e2e
        env:
          PLAYWRIGHT_REVIEW_SERVER: "1"
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
            playwright-report-nineveh/
            test-results-nineveh/
          retention-days: 14
