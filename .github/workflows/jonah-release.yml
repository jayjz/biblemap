name: Jonah editorial release approval

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial:
    name: Editorial release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - run: npm run validate:release
